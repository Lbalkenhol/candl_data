# SPTpol 500d BB
# Balkenhol, Coerver, Reichardt, Zebrowski 2025
# https://arxiv.org/abs/2510.07928
# Based on
# J.T. Sayre, C. L. Reichardt, J. W. Henning et al. 2019
# https://arxiv.org/abs/1910.05748
name: "SPTpol BB (Sayre et al. 2019)"
likelihood_form: "gaussian"

# FEEDBACK
feedback: True

# KEY FILES
band_power_file: "SPTpol_BB_bdp.txt"
covariance_file: "SPTpol_BB_cov.txt"
window_functions_folder: "windows/"
effective_frequencies: "effective_frequencies.yaml"

# DATA INFORMATION
spectra_info:
 - BB 95x95: 7
 - BB 95x150: 7
 - BB 150x150: 7

# DATA MODEL
data_model:
  - Module: "common.GalacticDust"
    descriptor: "Polarised Galactic Dust"
    amp_param: "D80_150ghz"
    alpha_param: "alpha_candl"
    beta_param: "beta_gal"
    effective_frequencies: "polarised_galactic_dust"
    affected_specs: ["BB 95x95", "BB 95x150", "BB 150x150"]
    ell_ref: 80
    nu_ref: 150
    T_GALDUST: 19.6
  - Module: "common.PoissonPower"
    descriptor: "BB Poisson"
    spec_param_dict:
      BB 95x95: "BB_Poisson_95x95"
      BB 95x150: "BB_Poisson_95x150"
      BB 150x150: "BB_Poisson_150x150"
    ell_ref: 3000
  - Module: "common.CalibrationAuto"
    inverse_calibration: False
    spec_param_dict:
      BB 95x95: ["pcal95", "pcal95"]
      BB 95x150: ["pcal95", "pcal150"]
      BB 150x150: ["pcal150", "pcal150"]

priors:
  - par_names: ["pcal95", "pcal150"]
    multiplicative_par: True
    prior_covariance: "SPTpol_BB_cal_cov.txt"
  - par_names: 'D80_150ghz'
    central_value: 0.0094
    prior_std: 0.0021
